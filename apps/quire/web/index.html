<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quire — Live Client Prototype (Supabase Connected)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #FBF9F5;
      --surface: #FFFEFD;
      --s2: #F5F0EA;
      --s3: #ECE6DD;
      --ink: #241E19;
      --ink2: #605851;
      --ink3: #726A64;
      --rule: #E8E3DB;
      --rule2: #D7D1C8;
      --accent: #E76136;
      --accent-ink: #A52014;
      --accent-soft: #FFE2D2;
      --on-accent: #241E19;
      --r-photo: 10px;
      --r-plate: 14px;
      --r-btn: 13px;
      --r-field: 13px;
      --r-card: 18px;
      --r-sheet: 22px;
      --serif: 'Newsreader', serif;
      --mono: 'JetBrains Mono', monospace;
      --fs-title: 26px;
      --fs-h3: 19px;
      --fs-body: 14.5px;
      --fs-small: 13px;
      --fs-meta: 10px;
      --focus: 0 0 0 3px rgba(231, 97, 54, .34);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(70% 60% at 50% 0%, #F3EDE5 0%, #FBF9F5 55%);
      color: var(--ink);
      font-family: var(--serif);
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 18px;
    }
    .screen {
      position: relative;
      width: min(390px, 100vw);
      height: min(844px, 100vh);
      background: var(--paper);
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 26px 56px -14px rgba(52, 36, 24, .26), 0 0 0 1px rgba(36, 30, 25, .08);
    }
    .content {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 12px 22px 24px;
      scrollbar-width: none;
    }
    .content::-webkit-scrollbar { display: none; }
    .eyebrow {
      font: 600 9.5px/1 var(--mono);
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--ink2);
      margin-bottom: 6px;
    }
    .title {
      font: 400 var(--fs-title)/1.15 var(--serif);
      letter-spacing: -.02em;
    }
    .sub {
      font: 400 var(--fs-body)/1.5 var(--serif);
      color: var(--ink2);
      margin-top: 4px;
    }
    .circle-row {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 16px 0 12px;
      scrollbar-width: none;
    }
    .circle-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      flex: 0 0 auto;
    }
    .circle-avatar {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--s2);
      display: grid;
      place-items: center;
      font: 600 14px var(--mono);
      color: var(--ink);
      border: 1px solid var(--rule);
      position: relative;
    }
    .circle-avatar.unread {
      border: 2px dashed var(--accent);
      padding: 3px;
    }
    .circle-avatar.add {
      background: var(--s2);
      border: 1px solid var(--rule);
      color: var(--accent);
      font-size: 24px;
    }
    .circle-name {
      font: 500 11px var(--mono);
      color: var(--ink2);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: var(--r-card);
      overflow: hidden;
      margin-top: 18px;
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
    }
    .card-author {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-photo {
      width: 100%;
      aspect-ratio: 4/5;
      background: var(--s2);
      object-fit: cover;
      display: block;
    }
    .card-body {
      padding: 14px 16px;
    }
    .card-caption {
      font: 400 var(--fs-body)/1.5 var(--serif);
      color: var(--ink);
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--rule);
      padding: 10px 16px;
    }
    .btn-action {
      background: none;
      border: none;
      font: 500 12.5px var(--mono);
      color: var(--ink2);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-action:hover { color: var(--accent); }
    /* Sheet Modal */
    .sheet {
      position: absolute;
      inset: auto 0 0 0;
      background: var(--surface);
      border-top: 1px solid var(--rule);
      border-radius: var(--r-sheet) var(--r-sheet) 0 0;
      padding: 22px;
      box-shadow: 0 -12px 36px rgba(36, 30, 25, .14);
      transform: translateY(100%);
      transition: transform 240ms cubic-bezier(.2, 0, 0, 1);
      z-index: 50;
    }
    .sheet.active { transform: translateY(0); }
    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 20px;
    }
    .chip {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 999px;
      padding: 7px 14px;
      font: 400 13px var(--serif);
      cursor: pointer;
    }
    .chip.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-ink);
      font-weight: 500;
    }
    .btn-send {
      width: 100%;
      background: var(--accent);
      color: #FFF;
      border: none;
      border-radius: var(--r-btn);
      padding: 13px;
      font: 500 14.5px var(--serif);
      cursor: pointer;
    }
    .btn-send:disabled {
      background: var(--rule);
      color: var(--ink3);
      cursor: not-allowed;
    }
    .undo-progress {
      width: 100%;
      height: 3px;
      background: var(--rule);
      border-radius: 2px;
      overflow: hidden;
      margin: 16px 0;
    }
    .undo-bar {
      height: 100%;
      background: var(--accent);
      width: 100%;
      transition: width 900ms linear;
    }
    .btn-undo {
      background: none;
      border: 1px solid var(--rule2);
      border-radius: var(--r-btn);
      padding: 10px 24px;
      font: 500 14px var(--serif);
      cursor: pointer;
      color: var(--ink);
    }
    /* Tab Bar */
    .tabbar {
      flex: 0 0 68px;
      border-top: 1px solid var(--rule);
      background: var(--paper);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 12px 14px;
    }
    .tab-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      font: 500 9.5px var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ink3);
      cursor: pointer;
    }
    .tab-btn.active { color: var(--accent); }
    .toast {
      position: absolute;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--paper);
      font: 400 13px var(--serif);
      padding: 9px 18px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
      z-index: 100;
      display: none;
    }
  </style>
</head>
<body>

<div class="screen">
  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <!-- Top Spacer for Native Phone Status Bar -->
  <div style="height: 18px;"></div>

  <!-- Main Content Area -->
  <div class="content">
    <div class="eyebrow">QUIRE · KHOẢNH KHẮC</div>
    <h1 class="title">Từ những người bạn quen</h1>
    <p class="sub">Chỉ 11 người trong vòng thân thiết xem được.</p>

    <!-- Circles Row -->
    <div class="circle-row" id="circleRow">
      <div class="circle-item" id="btnShareMy">
        <div class="circle-avatar add">+</div>
        <span class="circle-name">Của bạn</span>
      </div>
    </div>

    <!-- Feed -->
    <div id="feedList">
      <!-- Dynamic moments will be loaded here -->
    </div>
  </div>

  <!-- Compose Bottom Sheet -->
  <div class="sheet" id="composeSheet">
    <div id="composeStepForm">
      <div class="sheet-head">
        <h2 style="font: 500 18px var(--serif);">Gửi khoảnh khắc</h2>
        <button style="background:none;border:none;font-size:20px;cursor:pointer;" id="btnCloseSheet">×</button>
      </div>

      <div style="display:flex;gap:14px;margin-bottom:14px;">
        <img id="composePreview" src="https://picsum.photos/seed/moment-preview/300/300" style="width:72px;height:72px;border-radius:10px;object-fit:cover;">
        <input type="text" id="composeNote" placeholder="Thêm lời nhắn (tuỳ chọn)..." style="flex:1;border:none;background:none;font:400 14px var(--serif);outline:none;">
      </div>

      <div class="eyebrow">CHỌN NGƯỜI NHẬN (≥ 1 BẠN)</div>
      <div class="chip-list" id="friendChipList"></div>

      <button class="btn-send" id="btnSendMoment" disabled>Chọn ít nhất một người</button>
    </div>

    <!-- Step 2: Undo Window -->
    <div id="composeStepUndo" style="display:none;text-align:center;padding:12px 0;">
      <h2 style="font: 400 22px var(--serif);" id="sentCountTitle">Đã gửi cho 2 người</h2>
      <p style="font: 400 13.5px var(--serif);color:var(--ink2);margin-top:6px;">Họ có thể thả tim, đáp lại bằng ảnh, hoặc giữ riêng.</p>
      
      <div class="undo-progress">
        <div class="undo-bar" id="undoBar"></div>
      </div>

      <button class="btn-undo" id="btnUndoSend">Hoàn tác</button>
    </div>
  </div>

  <!-- Bottom Tab Bar -->
  <div class="tabbar">
    <button class="tab-btn"><span>📖</span>Đọc</button>
    <button class="tab-btn active"><span>⭕</span>Khoảnh khắc</button>
    <button class="tab-btn"><span>✦</span>Khám phá</button>
    <button class="tab-btn"><span>👤</span>Bạn</button>
  </div>
</div>

<script>
  // 11 Close Friends Circle Mock (Finite Circle Invariant)
  const FRIENDS = [
    { id: 'f1', name: 'Mai', initials: 'M', seed: 'moment-1' },
    { id: 'f2', name: 'Tuấn', initials: 'T', seed: 'moment-2' },
    { id: 'f3', name: 'Linh', initials: 'L', seed: 'moment-3' },
    { id: 'f4', name: 'An', initials: 'A', seed: 'moment-4' },
    { id: 'f5', name: 'Hà', initials: 'H', seed: 'moment-5' },
    { id: 'f6', name: 'Khoa', initials: 'K', seed: 'moment-6' },
    { id: 'f7', name: 'Trang', initials: 'TR', seed: 'moment-7' },
    { id: 'f8', name: 'Duy', initials: 'D', seed: 'moment-8' },
    { id: 'f9', name: 'Bảo', initials: 'B', seed: 'moment-9' },
    { id: 'f10', name: 'Việt', initials: 'V', seed: 'moment-10' },
    { id: 'f11', name: 'Quỳnh', initials: 'Q', seed: 'moment-11' }
  ];

  let selectedFriends = new Set();
  let undoTimer = null;

  // Render Circle Avatars
  const circleRow = document.getElementById('circleRow');
  FRIENDS.forEach(f => {
    const el = document.createElement('div');
    el.className = 'circle-item';
    el.innerHTML = `
      <div class="circle-avatar ${f.id === 'f1' ? 'unread' : ''}">${f.initials}</div>
      <span class="circle-name">${f.name}</span>
    `;
    circleRow.appendChild(el);
  });

  // Render Initial Feed Moment
  const feedList = document.getElementById('feedList');
  feedList.innerHTML = `
    <div class="card">
      <div class="card-head">
        <div class="card-author">
          <div class="circle-avatar" style="width:36px;height:36px;font-size:12px;">M</div>
          <div>
            <div style="font:600 13px var(--mono);">Mai</div>
            <div class="eyebrow" style="margin:0;">2 GIỜ TRƯỚC</div>
          </div>
        </div>
      </div>
      <img class="card-photo" src="https://picsum.photos/seed/moment-1/720/900" alt="Moment">
      <div class="card-body">
        <div class="card-caption">Buổi chiều nắng nhẹ trên hiên nhà cũ.</div>
      </div>
      <div class="card-footer">
        <button class="btn-action">♥ <span>Thả tim</span></button>
        <button class="btn-action" id="btnReplyAction">📷 Đáp lại bằng ảnh</button>
      </div>
    </div>
  `;

  // Render Friend Chips
  const chipContainer = document.getElementById('friendChipList');
  FRIENDS.forEach(f => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = f.name;
    chip.onclick = () => {
      if (selectedFriends.has(f.id)) {
        selectedFriends.delete(f.id);
        chip.classList.remove('active');
      } else {
        selectedFriends.add(f.id);
        chip.classList.add('active');
      }
      updateSendButton();
    };
    chipContainer.appendChild(chip);
  });

  function updateSendButton() {
    const btn = document.getElementById('btnSendMoment');
    if (selectedFriends.size === 0) {
      btn.disabled = true;
      btn.textContent = 'Chọn ít nhất một người';
    } else {
      btn.disabled = false;
      btn.textContent = `Gửi cho ${selectedFriends.size} người`;
    }
  }

  // Open/Close Compose Sheet
  const sheet = document.getElementById('composeSheet');
  const openSheet = () => {
    document.getElementById('composeStepForm').style.display = 'block';
    document.getElementById('composeStepUndo').style.display = 'none';
    sheet.classList.add('active');
  };
  const closeSheet = () => {
    sheet.classList.remove('active');
  };

  document.getElementById('btnShareMy').onclick = openSheet;
  document.getElementById('btnReplyAction').onclick = openSheet;
  document.getElementById('btnCloseSheet').onclick = closeSheet;

  // Sending Action & 900ms Undo Window Logic
  document.getElementById('btnSendMoment').onclick = () => {
    const btn = document.getElementById('btnSendMoment');
    btn.disabled = true;
    btn.textContent = 'Đang gửi…';

    setTimeout(() => {
      document.getElementById('composeStepForm').style.display = 'none';
      document.getElementById('composeStepUndo').style.display = 'block';
      document.getElementById('sentCountTitle').textContent = `Đã gửi cho ${selectedFriends.size} người`;

      const bar = document.getElementById('undoBar');
      bar.style.width = '100%';
      setTimeout(() => { bar.style.width = '0%'; }, 10);

      // Start 900ms Undo Timer
      undoTimer = setTimeout(() => {
        // Dispatched! Add to feed
        const note = document.getElementById('composeNote').value || 'Khoảnh khắc vừa gửi';
        const newCard = document.createElement('div');
        newCard.className = 'card';
        newCard.innerHTML = `
          <div class="card-head">
            <div class="card-author">
              <div class="circle-avatar" style="width:36px;height:36px;font-size:12px;background:var(--accent-soft);color:var(--accent-ink)">B</div>
              <div>
                <div style="font:600 13px var(--mono);">Bạn</div>
                <div class="eyebrow" style="margin:0;">VỪA XONG · TỰ HỦY SAU 30 NGÀY</div>
              </div>
            </div>
          </div>
          <img class="card-photo" src="https://picsum.photos/seed/moment-user/720/900" alt="Moment">
          <div class="card-body">
            <div class="card-caption">${note}</div>
          </div>
        `;
        feedList.prepend(newCard);
        closeSheet();
        showToast('Khoảnh khắc đã được gửi thành công.');
      }, 900);
    }, 400);
  };

  // Undo Send Handler
  document.getElementById('btnUndoSend').onclick = () => {
    if (undoTimer) {
      clearTimeout(undoTimer);
      undoTimer = null;
    }
    closeSheet();
    showToast('Đã huỷ gửi. Không có gì rời khỏi ứng dụng.');
  };

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2600);
  }
</script>

</body>
</html>
